<!doctype html>
<html><head><meta charset="utf-8"><title>Target: board toolbars</title>
<link rel="stylesheet" href="../../frontend/css/style.css">
<style>
body{padding:32px;max-width:900px;font-size:14px}
.r{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 16px}
.s{width:1px;height:20px;background:#ccc;margin:0 4px}

</style></head><body>
<p style='font-size:12px;color:#888'>Target v01 · 2026-10-16 18:29 PDT · approved layout. Dashed = new button on that screen.</p>
